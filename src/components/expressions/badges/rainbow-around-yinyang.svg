        <dc:title>rainbow around yinyang</dc:title>
        <dc:date>2011-07-04T04:42:29</dc:date>
        <dc:description>It's the yinyang with the 12 color 72gon as a background.&#13;\nI redrew the yinyang from scratch. It's really easy to draw. It's made only of circles and half circles!&#13;\n&#13;\nBlack and White have a hard time being visible on some sites with a default background of white or black. The rainbow colors help people to see it anywhere.</dc:description>
